amcl:
  ros__parameters:
    use_sim_time: false
    scan_topic: /scan_filtered

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link

controller_server:

  ros__parameters:

    use_sim_time: false

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001

    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"

    goal_checker_plugins: ["goal_checker"]

    controller_plugins: ["FollowPath"]

    # Basic progress and goal checkers to avoid oscillation near goal
    failure_tolerance: 0.3
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.17
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # Giảm tốc độ tiến tối đa để tránh vọt qua goal
      max_vel_x: 0.04
      min_vel_x: 0.0
      max_speed_xy: 0.04
      min_speed_xy: 0.0

      # Giảm tốc độ xoay tối đa và giới hạn để dừng mượt (match teleop)
      max_vel_theta: 0.04
      min_vel_theta: -0.09

      # Tăng giới hạn gia tốc và phanh (phanh mạnh hơn) để giảm overshoot
      acc_lim_x: 0.2
      acc_lim_theta: 0.2
      decel_lim_x: -0.4
      decel_lim_theta: -0.3

      # Giảm số mẫu tuyến tính để giảm rồ máy khi gần mục tiêu
      vx_samples: 10
      vtheta_samples: 20

      # Giảm thời gian mô phỏng để phản ứng ngắn hạn hơn khi tiếp cận goal
      sim_time: 1.0

planner_server:

  ros__parameters:

    expected_planner_frequency: 10.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"

      tolerance: 0.5

      use_astar: false

recoveries_server:

  ros__parameters:

    recovery_plugins:
      - spin
      - backup
      - wait

    spin:
      plugin: "nav2_recoveries/Spin"

    backup:
      plugin: "nav2_recoveries/BackUp"

    wait:
      plugin: "nav2_recoveries/Wait"

map_server:

  ros__parameters:

    use_sim_time: false

    yaml_filename: ""

global_costmap:

  global_costmap:

    ros__parameters:

      global_frame: map

      robot_base_frame: base_link

      resolution: 0.05

      update_frequency: 5.0

      publish_frequency: 2.0

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

local_costmap:

  local_costmap:

    ros__parameters:

      global_frame: odom

      robot_base_frame: base_link

      rolling_window: true

      width: 6.0

      height: 6.0

      resolution: 0.05

      update_frequency: 10.0

      publish_frequency: 5.0

      plugins:
        - obstacle_layer
        - inflation_layer

lifecycle_manager:

  ros__parameters:

    use_sim_time: false

    autostart: true

    node_names:
      - map_server
      - planner_server
      - controller_server
      - bt_navigator
      - recoveries_server
      - amcl